openapi: 3.1.0
info:
  title: Edgelet API
  version: 1.0.3
  description: >
    Edgelet API v1 baseline for Edgelet daemon and CLI.
    Canonical namespace is /v1. Any path/schema/auth deviation must be
    explicitly approved before implementation.
servers:
  - url: https://edgelet.default.svc.bridge.local
    description: HTTPS/WSS transport for microservices and local clients
  - url: http+unix://%2Frun%2Fedgelet%2Fedgelet.sock
    description: Unix socket transport for CLI/admin operations
security:
  - BearerAuth: []
paths:
  /health/live:
    get:
      tags: [System]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
  /health/ready:
    get:
      tags: [System]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Agent is ready
        "503":
          description: Agent is not ready
  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Metrics stream
  /v1/system/status:
    get:
      tags: [System]
      summary: Get daemon status
      responses:
        "200":
          description: Current daemon status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/system/info:
    get:
      tags: [System]
      summary: Get daemon runtime info
      responses:
        "200":
          description: Runtime metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/system/version:
    get:
      tags: [System]
      summary: Get daemon version
      responses:
        "200":
          description: Build and version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/system/provision:
    post:
      tags: [System]
      summary: Provision agent with controller key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provisioningKey]
              properties:
                provisioningKey:
                  type: string
      responses:
        "200":
          description: Provisioned successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [System]
      summary: Deprovision agent
      description: >
        Optional scope controls cleanup behavior. Default scope is all.
        scope=local preserves local microservices while deprovisioning from controller.
      parameters:
        - in: query
          name: scope
          required: false
          schema:
            type: string
            enum: [all, local]
      responses:
        "200":
          description: Deprovisioned successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/system/reload:
    post:
      tags: [System]
      summary: Trigger daemon config/module reload
      responses:
        "200":
          description: Reload triggered
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/system/prune:
    post:
      tags: [System]
      summary: Trigger prune operation
      parameters:
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum: [dangling, containers, volumes, all]
            default: dangling
      responses:
        "200":
          description: Prune accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/system/logs:
    get:
      tags: [Logs]
      summary: Fetch bounded daemon logs
      parameters:
        - in: query
          name: tailLines
          schema:
            type: integer
            minimum: 1
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Daemon log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/system/logs:stream:
    get:
      tags: [Logs]
      summary: Stream daemon logs over websocket (follow mode)
      parameters:
        - in: query
          name: tailLines
          schema:
            type: integer
            minimum: 1
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/images:
    get:
      tags: [Images]
      summary: List local images
      responses:
        "200":
          description: Image list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/images:pull:
    post:
      tags: [Images]
      summary: Pull image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePullRequest"
      responses:
        "200":
          description: Pull result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePullResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/images:pull/{operationId}:
    get:
      tags: [Images]
      summary: Get image pull operation status
      parameters:
        - in: path
          name: operationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pull operation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePullOperationStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/images:load:
    post:
      tags: [Images]
      summary: Load image archive from daemon-local path (async)
      description: Accepts load work and returns operationId. Poll GET /v1/images:load/{operationId}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageLoadRequest"
      responses:
        "202":
          description: Load accepted
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/images:load/{operationId}:
    get:
      tags: [Images]
      summary: Image load operation status
      parameters:
        - in: path
          name: operationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Operation status
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/images:prune:
    post:
      tags: [Images]
      summary: Prune dangling images
      parameters:
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum: [dangling]
            default: dangling
      responses:
        "200":
          description: Prune result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePruneResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/images:remove:
    post:
      tags: [Images]
      summary: Remove local image by selector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageRemoveRequest"
      responses:
        "200":
          description: Remove result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRemoveResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/system/gps:
    get:
      tags: [System]
      summary: Get current GPS coordinates
      responses:
        "200":
          description: Current coordinates
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, lat, lon]
                properties:
                  status:
                    type: string
                  timestamp:
                    type: integer
                  lat:
                    type: string
                  lon:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [System]
      summary: Set GPS coordinates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat:
                  oneOf:
                    - type: string
                    - type: number
                lon:
                  oneOf:
                    - type: string
                    - type: number
      responses:
        "200":
          description: GPS coordinates updated
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/system/config:
    get:
      tags: [Config]
      summary: Get active config
      responses:
        "200":
          description: Active config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigView"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Config]
      summary: Patch active config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigPatchRequest"
      responses:
        "200":
          description: Patch result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/system/controller/cert:
    post:
      tags: [System]
      summary: Update controller certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificate]
              properties:
                certificate:
                  type: string
                  description: Base64-encoded PEM certificate string
      responses:
        "200":
          description: Controller certificate updated
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/system/controlplane:
    get:
      tags: [System]
      summary: Get local ControlPlane deployment status
      description: Admin-only. Returns singleton controller deployment status.
      responses:
        "200":
          description: ControlPlane status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPlaneStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [System]
      summary: Delete local ControlPlane deployment
      description: Admin-only. Stops the controller container, removes volumes, and deletes the SQLite row.
      responses:
        "200":
          description: ControlPlane deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/system/controlplane/manifest:
    get:
      tags: [System]
      summary: Get ControlPlane manifest with secrets masked
      responses:
        "200":
          description: Masked manifest YAML
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifestYaml:
                    type: string
                  masked:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/system/controlplane/restart:
    post:
      tags: [System]
      summary: Restart local ControlPlane controller container
      description: Admin-only. Bounces the singleton controller container without deprovisioning. Allowed when the agent is provisioned.
      parameters:
        - name: pull
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, recreate the container and pull the image.
      responses:
        "200":
          description: ControlPlane restarted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ControlPlaneStatus"
                  - type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        example: ok
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/system/controller:
    get:
      tags: [System]
      summary: Get local ControlPlane status (alias)
      description: Alias of GET /v1/system/controlplane. Delete is not supported on this path.
      responses:
        "200":
          description: ControlPlane status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlPlaneStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/system/config/switch:
    post:
      tags: [Config]
      summary: Switch active config profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile:
                  type: string
                  enum: [dev, prod, def, development, production, default]
      responses:
        "200":
          description: Config profile switched
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/microservices/config:
    get:
      tags: [Microservices]
      summary: Get calling microservice config (self)
      responses:
        "200":
          description: Calling microservice config payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          $ref: "#/components/responses/Unauthorized"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/microservices/control:
    get:
      tags: [Microservices]
      summary: WebSocket control channel (self)
      description: >
        Upgrades to WSS control channel for the calling microservice identity.
        Server resolves microservice UUID from JWT claim `iofog.org.microservice.uuid`.
        Server may push binary opcodes: `0xC` (config changed — fetch
        `GET /v1/microservices/config`), `0xF` (agent resource limits changed).
      responses:
        "101":
          description: Switching Protocols
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/ms:
    get:
      tags: [Microservices]
      summary: List microservices
      parameters:
        - in: query
          name: source
          schema:
            type: string
            enum: [managed, local, controlplane, all]
          description: Filter by workload source (default all).
      responses:
        "200":
          description: Microservice list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MicroserviceRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/ms/{id}:
    get:
      tags: [Microservices]
      summary: Inspect microservice
      description: >
        Selector supports UUID, container ID prefix, or dotted application/name.
        Local microservices can be resolved as edgelet.<name> (for example edgelet.router).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Microservice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroserviceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Microservices]
      summary: Remove microservice
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Remove result
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/ms/{id}/start:
    post:
      tags: [Microservices]
      summary: Start microservice
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Start result
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/ms/{id}/stop:
    post:
      tags: [Microservices]
      summary: Stop microservice
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stop result
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/ms/{id}/kill:
    post:
      tags: [Microservices]
      summary: Kill microservice
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                signal:
                  type: string
      responses:
        "200":
          description: Kill result
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/ms/{id}/restart:
    post:
      tags: [Microservices]
      summary: Restart microservice
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restart result
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/ms/{id}/logs:
    get:
      tags: [Logs]
      summary: Fetch bounded logs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: tailLines
          schema:
            type: integer
            minimum: 1
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: until
          schema:
            type: string
            format: date-time
        - in: query
          name: timestamps
          schema:
            type: boolean
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/ms/{id}/logs:stream:
    get:
      tags: [Logs]
      summary: Stream logs over websocket (follow mode)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/ms/{id}/exec/sessions:
    post:
      tags: [Exec]
      summary: Create exec session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecSessionCreateRequest"
      responses:
        "200":
          description: Exec session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecSessionCreateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ms/{id}/exec/sessions/{sessionId}:
    get:
      tags: [Exec]
      summary: Get exec session status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exec session status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Exec]
      summary: Stop exec session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exec session stopped
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/ms/{id}/exec/sessions/{sessionId}:attach:
    get:
      tags: [Exec]
      summary: Attach interactive terminal over websocket
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/deploy/microservices:apply:
    post:
      tags: [Deploy]
      summary: Apply local microservice YAML (asynchronous operation)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DeployManifestMultipartRequest"
      responses:
        "202":
          description: Apply operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployMicroserviceApplyOperationStartResponse"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/deploy/microservices:apply/{operationId}:
    get:
      tags: [Deploy]
      summary: Get asynchronous apply operation status
      parameters:
        - in: path
          name: operationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Apply operation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployMicroserviceApplyOperationStatusResponse"
              examples:
                running:
                  value:
                    success: true
                    data:
                      operationId: dep_apply_4f3b2a9f
                      status: running
                      startedAt: "2026-05-14T00:10:12Z"
                      stage: pulling
                succeeded:
                  value:
                    success: true
                    data:
                      operationId: dep_apply_4f3b2a9f
                      status: succeeded
                      startedAt: "2026-05-14T00:10:12Z"
                      endedAt: "2026-05-14T00:11:02Z"
                      deploymentId: "42"
                      stage: done
                failed:
                  value:
                    success: true
                    data:
                      operationId: dep_apply_4f3b2a9f
                      status: failed
                      startedAt: "2026-05-14T00:10:12Z"
                      endedAt: "2026-05-14T00:10:44Z"
                      stage: creating
                      error:
                        code: INTERNAL
                        message: "failed to create container: image pull timeout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/deploy/microservices:validate:
    post:
      tags: [Deploy]
      summary: Validate local microservice YAML
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DeployManifestMultipartRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/deploy/microservices:
    get:
      tags: [Deploy]
      summary: List local deployed microservices
      responses:
        "200":
          description: Local deployed list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
