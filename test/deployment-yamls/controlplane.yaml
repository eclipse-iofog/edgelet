apiVersion: edgelet.iofog.org/v1
kind: ControlPlane
metadata:
  name: foo
  namespace: bar
spec:
  controller:
    image: ghcr.io/datasance/controller:3.8.1
    registry: 1
    port: 51121
    # publicUrl: https://controller.example.com
    publicUrl: http://localhost:51121
    # trustProxy: true
  console:
    port: 8008
    url: http://localhost
  auth:
    mode: embedded
    insecureAllowHttp: true
    insecureAllowBootstrapLog: false
    bootstrap:
      username: admin
      password: AdminPass123!!
  # auth external example:
  #   mode: external
  #   issuerUrl: https://auth.example.com/realms/myrealm
  #   issuerCa: <base64 PEM or PEM bundle>
  #   client:
  #     id: pot-controller
  #     secret: <replace-me>
  # database: # an external database or have multiple controllers for the ControlPlane, you can set the database here
  #     provider: postgres/mysql  
  #     user: 
  #     host: 
  #     port: 5432
  #     password: 
  #     databaseName: 
  #     ssl: true/false 
  #     ca: base64 encoded string
  events:  # enable/disable or configure controller audit events
    auditEnabled: true   # true / false
    retentionDays: 14    # how many days should controller saved events records
    cleanupInterval: 86400  # controller internal event cleanup job interval in seconds.
    captureIpAddress: true
  systemMicroservices:
    router:
      # amd64: ghcr.io/datasance/router:3.8.0
      arm64: ghcr.io/datasance/router:3.8.1
      # riscv64: ghcr.io/datasance/router:3.8.0
      # arm: ghcr.io/datasance/router:3.8.0
    nats:   # when nats.enabled is true
      # amd64: ghcr.io/datasance/nats:2.14.2
      arm64: ghcr.io/datasance/nats:2.14.3-1
    #   riscv64: ghcr.io/datasance/nats:2.14.2
    #   arm: ghcr.io/datasance/nats:2.14.2
  nats:  # optional; when present and enabled, NATS is deployed with JetStream
    enabled: true  # set to false to disable NATS
  logLevel: debug
  # tls: # optional; when set, controller listeners use HTTPS. Provide either path or base64, not both.
  #   path: /etc/edgelet/controller-tls  # absolute host dir with tls.crt + tls.key (+ optional ca.crt)
  #   base64:
  #     ca: base64 encoded string (optional)
  #     cert: base64 encoded string (required when base64 block is used)
  #     key: base64 encoded string (required when base64 block is used)
  # vault:  # optional; when set, operator creates a Secret from provider config and injects VAULT_* env vars into the controller
  #   enabled: true
  #   provider: openbao  # hashicorp, openbao, vault, aws, aws-secrets-manager, azure, azure-key-vault, google, google-secret-manager
  #   basePath: "pot/local-test/secrets"  # $namespace is replaced with the ControlPlane namespace
  #   hashicorp:
  #     address: "http://192.168.139.3:8200"
  #     token: "<replace-me>"
  #     mount: "kv"
