name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.26.4'
  REGISTRY: ghcr.io
  IMAGE: ${{ vars.EDGELET_CONTAINER_IMAGE }}
  DEBUGGER_IMAGE: ${{ vars.DEBUGGER_CONTAINER_IMAGE }}
  GITHUB_REPO: ${{ vars.EDGELET_GITHUB_REPO }}

permissions: read-all

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            buildarch: amd64
            runner: ubuntu-latest
          - arch: arm64
            buildarch: arm64
            runner: ubuntu-24.04-arm
          - arch: arm
            buildarch: amd64
            runner: ubuntu-latest
            goarm: '7'
          - arch: riscv64
            buildarch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # Ubuntu Noble has no armhf/riscv64 apt indexes; embed cross builds use
      # build/Dockerfile.embedded (Debian Trixie), same as test/release/build-all.sh.
      - name: Install embed build deps
        if: matrix.arch == 'amd64' || matrix.arch == 'arm64'
        run: |
          chmod +x scripts/install-embed-build-deps
          sudo BUILDARCH=${{ matrix.buildarch }} TARGETARCH=${{ matrix.arch }} \
            ./scripts/install-embed-build-deps

      - name: Embed pipeline (Docker — arm / riscv64)
        if: matrix.arch == 'arm' || matrix.arch == 'riscv64'
        run: |
          docker build -f build/Dockerfile.embedded -t edgelet-embed-ci-amd64 .
          docker run --rm -e GOFLAGS=-buildvcs=false -v "$PWD:/src" -w /src edgelet-embed-ci-amd64 \
            bash -c 'chmod +x scripts/* 2>/dev/null || true; \
              ARCH=${{ matrix.arch }} ./scripts/download && \
              ARCH=${{ matrix.arch }} ./scripts/build-embedded && \
              ARCH=${{ matrix.arch }} ./scripts/build-edgelet fat && \
              ARCH=${{ matrix.arch }} ./scripts/package-data'

      - name: Build thin linux edgelet
        env:
          ARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x scripts/*
          if [ "${{ matrix.arch }}" = amd64 ] || [ "${{ matrix.arch }}" = arm64 ]; then
            ARCH=${{ matrix.arch }} ./scripts/download
            ARCH=${{ matrix.arch }} ./scripts/build-embedded
            ARCH=${{ matrix.arch }} ./scripts/build-edgelet fat
            ARCH=${{ matrix.arch }} ./scripts/package-data
          fi
          ARCH=${{ matrix.arch }} ./scripts/build-edgelet
          ARCH=${{ matrix.arch }} ./scripts/binary_size_check.sh
          test -f "build/edgelet-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edgelet-linux-${{ matrix.arch }}
          path: build/edgelet-linux-${{ matrix.arch }}
          if-no-files-found: error

  build-desktop:
    name: Desktop ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-amd64
            goos: darwin
            goarch: amd64
            out: build/edgelet-darwin-amd64
          - id: darwin-arm64
            goos: darwin
            goarch: arm64
            out: build/edgelet-darwin-arm64
          - id: windows-amd64
            goos: windows
            goarch: amd64
            out: build/edgelet-windows-amd64.exe
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build desktop edgelet
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p build
          PKG=github.com/eclipse-iofog/edgelet
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          GIT_COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w \
            -X main.version=${VERSION} \
            -X main.buildTime=${BUILD_TIME} \
            -X main.gitCommit=${GIT_COMMIT} \
            -X ${PKG}/internal/cli/cmd.Version=${VERSION} \
            -X ${PKG}/internal/cli/cmd.BuildTime=${BUILD_TIME} \
            -X ${PKG}/internal/cli/cmd.GitCommit=${GIT_COMMIT} \
            -X ${PKG}/internal/version.Version=${VERSION} \
            -X ${PKG}/internal/version.BuildTime=${BUILD_TIME} \
            -X ${PKG}/internal/version.GitCommit=${GIT_COMMIT}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "${LDFLAGS}" \
            -o "${{ matrix.out }}" ./cmd/edgelet
          test -f "${{ matrix.out }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edgelet-${{ matrix.id }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  package:
    name: Package release assets
    runs-on: ubuntu-latest
    needs: [build-linux, build-desktop]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: edgelet-*
          merge-multiple: true
          path: artifacts

      - name: Stage binaries
        run: |
          mkdir -p build
          find artifacts -type f -name 'edgelet-*' -exec cp {} build/ \;
          ls -la build/

      - name: Build dist/ + SHA256SUMS
        run: |
          chmod +x scripts/release-binaries.sh
          ./scripts/release-binaries.sh "${{ github.ref_name }}"
          ls -la dist/

      - name: Stamp install.sh for this publisher
        env:
          EDGELET_GITHUB_REPO: ${{ vars.EDGELET_GITHUB_REPO }}
        run: |
          test -n "$EDGELET_GITHUB_REPO"
          sed -i "s|^GITHUB_REPO=.*|GITHUB_REPO=\"\${EDGELET_GITHUB_REPO:-${EDGELET_GITHUB_REPO}}\"|" dist/install.sh
          grep '^GITHUB_REPO=' dist/install.sh
          (
            cd dist
            sha256sum edgelet-* edgelet-config.yaml.sample edgelet-controller-ca.crt.sample \
              install.sh uninstall.sh > SHA256SUMS
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts (keyless cosign)
        run: |
          set -euo pipefail
          for f in dist/*; do
            case "$(basename "$f")" in
              *.pem|*.sigstore) continue ;;
            esac
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --bundle "${f}.sigstore" \
              "$f"
          done
          shopt -s nullglob
          bundles=(dist/*.sigstore)
          test "${#bundles[@]}" -gt 0
          ls -la dist/

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ${{ vars.EDGELET_CONTAINER_IMAGE }}
          DEBUGGER_IMAGE: ${{ vars.DEBUGGER_CONTAINER_IMAGE }}
        run: |
          set -euo pipefail
          CONTAINER_TAG="${REF_NAME#v}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${REF_NAME}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body' > release_notes.md
          printf '%s\n' \
            '' \
            '## Downloads' \
            '' \
            'Raw binaries, `SHA256SUMS`, sample config/CA, and install scripts — no tarballs or DEB/RPM packages.' \
            '' \
            '### Binaries' \
            '- `edgelet-linux-amd64`, `edgelet-linux-arm64`, `edgelet-linux-arm`, `edgelet-linux-riscv64`' \
            '- `edgelet-darwin-amd64`, `edgelet-darwin-arm64`' \
            '- `edgelet-windows-amd64.exe`' \
            '' \
            '### Container images' \
            '```bash' \
            "docker pull ${IMAGE}:${CONTAINER_TAG}" \
            "docker pull ${DEBUGGER_IMAGE}:${CONTAINER_TAG}" \
            '```' \
            >> release_notes.md

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  container:
    name: Push edgelet image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set container image tag
        run: echo "CONTAINER_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ env.CONTAINER_TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.CONTAINER_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}

  container-debugger:
    name: Push debugger image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set container image tag
        run: echo "CONTAINER_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.debugger
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          push: true
          tags: |
            ${{ env.DEBUGGER_IMAGE }}:${{ env.CONTAINER_TAG }}
            ${{ env.DEBUGGER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.CONTAINER_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
