#
# IOFog Agent Configuration
# This file contains all configuration profiles in a single YAML file

currentProfile: default  # default | development | production

profiles:
  default:
    controllerUrl: "http://localhost:54421/api/v3/"
    iofogUuid: ""
    secureMode: "off"
    devMode: "off"
    controllerCert: "/etc/edgelet/cert.crt"
    arch: "auto"
    networkInterface: "dynamic"
    # containerEngine selects the container runtime.
    # Supported values:
    #   docker  — use Docker daemon (requires Docker installed on host).
    #             containerEngineUrl specifies the socket path.
    #   podman  — use Podman daemon via its Docker-compatible API.
    #             containerEngineUrl is used as the Podman socket path; if empty,
    #             the default Podman socket is auto-detected.
    #   edgelet — use the embedded containerd engine bundled with edgelet (linux only).
    #             containerEngineUrl is ignored; the daemon always connects to its private
    #             socket at /run/edgelet/containerd.sock.
    #             Persistent data lives in /var/lib/edgelet-containerd/ and
    #             is NOT counted against diskDirectory/diskLimit.
    containerEngine: "edgelet"
    containerEngineUrl: "unix:///run/edgelet/containerd.sock"
    diskLimit: "10"
    diskDirectory: "/var/lib/edgelet/"
    memoryLimit: "4096"
    cpuLimit: "80.0"
    logLimit: "10.0"
    logDirectory: "/var/log/edgelet/"
    logFileCount: "10"
    logLevel: "INFO"
    statusFrequency: "10"
    changeFrequency: "10"
    gps: "auto"
    gpsCoordinates: "0,0"
    gpsDevice: ""
    gpsScanFrequency: "60"
    watchdogEnabled: "off"
    edgeGuardFrequency: "0"
    pruningFrequency: "0"
    availableDiskThreshold: "20"
    upgradeScanFrequency: "24"
    timeZone: ""
    namespace: "default"

  development:
    controllerUrl: "http://localhost:51121/api/v3/"
    iofogUuid: ""
    secureMode: "off"
    devMode: "on"
    controllerCert: "/etc/edgelet/cert.crt"
    arch: "auto"
    networkInterface: "dynamic"
    # containerEngine selects the container runtime.
    # Supported values:
    #   docker  — use Docker daemon (requires Docker installed on host).
    #             containerEngineUrl specifies the socket path.
    #   podman  — use Podman daemon via its Docker-compatible API.
    #             containerEngineUrl is used as the Podman socket path; if empty,
    #             the default Podman socket is auto-detected.
    #   edgelet — use the embedded containerd engine bundled with edgelet (linux only).
    #             containerEngineUrl is ignored; the daemon always connects to its private
    #             socket at /run/edgelet/containerd.sock.
    #             Persistent data lives in /var/lib/edgelet-containerd/ and
    #             is NOT counted against diskDirectory/diskLimit.
    containerEngine: "edgelet"
    containerEngineUrl: "unix:///run/edgelet/containerd.sock"
    diskLimit: "10"
    diskDirectory: "/var/lib/edgelet/"
    memoryLimit: "4096"
    cpuLimit: "80.0"
    logLimit: "10.0"
    logDirectory: "/var/log/edgelet/"
    logFileCount: "10"
    logLevel: "INFO"
    statusFrequency: "10"
    changeFrequency: "10"
    gps: "auto"
    gpsCoordinates: "0,0"
    gpsDevice: ""
    gpsScanFrequency: "60"
    watchdogEnabled: "off"
    edgeGuardFrequency: "0"
    pruningFrequency: "0"
    availableDiskThreshold: "20"
    upgradeScanFrequency: "24"
    timeZone: ""
    namespace: "default"

  production:
    controllerUrl: "http://localhost:54421/api/v3/"
    iofogUuid: ""
    secureMode: "on"
    devMode: "off"
    controllerCert: "/etc/edgelet/cert.crt"
    arch: "auto"
    networkInterface: "dynamic"
    # containerEngine selects the container runtime.
    # Supported values:
    #   docker  — use Docker daemon (requires Docker installed on host).
    #             containerEngineUrl specifies the socket path.
    #   podman  — use Podman daemon via its Docker-compatible API.
    #             containerEngineUrl is used as the Podman socket path; if empty,
    #             the default Podman socket is auto-detected.
    #   edgelet — use the embedded containerd engine bundled with edgelet (linux only).
    #             containerEngineUrl is ignored; the daemon always connects to its private
    #             socket at /run/edgelet/containerd.sock.
    #             Persistent data lives in /var/lib/edgelet-containerd/ and
    #             is NOT counted against diskDirectory/diskLimit.
    containerEngine: "edgelet"
    containerEngineUrl: "unix:///run/edgelet/containerd.sock"
    diskLimit: "10"
    diskDirectory: "/var/lib/edgelet/"
    memoryLimit: "4096"
    cpuLimit: "80.0"
    logLimit: "10.0"
    logDirectory: "/var/log/edgelet/"
    logFileCount: "10"
    logLevel: "INFO"
    statusFrequency: "10"
    changeFrequency: "10"
    gps: "auto"
    gpsCoordinates: "0,0"
    gpsDevice: ""
    gpsScanFrequency: "60"
    watchdogEnabled: "off"
    edgeGuardFrequency: "0"
    pruningFrequency: "0"
    availableDiskThreshold: "20"
    upgradeScanFrequency: "24"
    timeZone: ""
    namespace: "default"
